name: Deploy GitHub Pages
run-name: Publikacja Pages · ${{ github.event_name }}

on:
  push:
  workflow_dispatch:
  workflow_run:
    workflows: ['Synchronize IDEIS schedule']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      (github.event_name != 'workflow_run' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    # Chrome keeps its sandbox on this runner (no Ubuntu 23.10+ AppArmor issue).
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    permissions:
      contents: read
      pages: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - name: Test schedule rules
        run: npm run test:server
      - name: Test application logic
        run: npm test
      - name: Find a verified schedule artifact
        id: schedule_run
        uses: actions/github-script@v9
        with:
          script: |
            const { selectScheduleRun } = await import(`${process.env.GITHUB_WORKSPACE}/server/pages-schedule.mjs`);
            const runId = await selectScheduleRun({ github, context });
            core.setOutput('run-id', runId ?? '');
      - name: Download the schedule from synchronization
        if: steps.schedule_run.outputs.run-id != ''
        uses: actions/download-artifact@v8
        with:
          name: ideis-schedule
          path: public/data
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.schedule_run.outputs.run-id }}
      - name: Validate restored schedule
        id: schedule
        run: node server/check-pages-schedule.mjs
      - name: Install Chrome for first deployment or expired data
        if: steps.schedule.outputs.needs-fetch == 'true'
        run: npx puppeteer browsers install chrome
      - name: Fetch schedule when publishing code without a current artifact
        if: steps.schedule.outputs.needs-fetch == 'true'
        run: npm run sync:schedule
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build static application
        run: npm run build:pages
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/ideis-schedule/browser

  deploy:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
