name: Synchronize IDEIS and deploy Pages

on:
  push:
  workflow_dispatch:
  schedule:
    # UTC: 00:17, 03:17, 06:17, 09:17, 12:17, 15:17, 18:17, 21:17.
    - cron: '17 */3 * * *'

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    # Chrome keeps its sandbox on this runner (no Ubuntu 23.10+ AppArmor issue).
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - name: Install Chrome for Puppeteer
        run: npx puppeteer browsers install chrome
      - name: Test schedule rules
        run: npm run test:server
      - name: Test application logic
        run: npm test
      - name: Fetch the semester for groups 1, 1A and 1B
        run: npm run sync:schedule
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build static application
        run: npm run build:pages
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/ideis-schedule/browser

  deploy:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
