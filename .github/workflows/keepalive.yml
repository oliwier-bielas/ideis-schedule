name: Weekly repository keepalive

on:
  workflow_dispatch:
  schedule:
    # Every Monday at 05:37 UTC.
    - cron: '37 5 * * 1'

permissions:
  contents: read

concurrency:
  group: repository-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Test the Python script against disposable local repositories
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Push an empty maintenance commit
        run: python3 scripts/keepalive.py --branch "$DEFAULT_BRANCH" --push
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
