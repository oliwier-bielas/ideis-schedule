name: Synchronize IDEIS schedule
run-name: Pobieranie planu · ${{ github.event_name }}

on:
  workflow_dispatch:
  schedule:
    # UTC: 00:17, 03:17, 06:17, 09:17, 12:17, 15:17, 18:17, 21:17.
    - cron: '17 0,3,6,9,12,15,18,21 * * *'

permissions:
  contents: read

concurrency:
  group: ideis-schedule-sync
  cancel-in-progress: false

jobs:
  synchronize:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - name: Test schedule rules
        run: npm run test:server
      - name: Install Chrome for Puppeteer
        run: npx puppeteer browsers install chrome
      - name: Fetch and validate the semester for groups 1, 1A and 1B
        run: npm run sync:schedule
      - name: Save the verified schedule for Pages
        uses: actions/upload-artifact@v7
        with:
          name: ideis-schedule
          path: public/data/schedule.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7
